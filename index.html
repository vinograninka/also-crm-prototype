  function openClient(id){const c=client(id);if(!c)return;const ds=data.deals.filter(function(d){return d.clientId===c.id&&!d.spam;});openModal(modalHead(esc(c.name),esc(c.brand))+'<div class="dialog-body"><form id="client-profile-form" data-id="'+c.id+'"><div class="form-grid"><label class="field">Сегмент<select name="segment" required>'+options(Object.keys(CONTACT_SEGMENTS).map(function(k){return {id:k,name:CONTACT_SEGMENTS[k].name};}),c.segment)+'</select></label><label class="field">Постоянная скидка, %<input type="number" name="discount" min="0" max="100" step="0.1" value="'+Number(c.discount||0)+'" required></label></div><p class="hint">'+icon('info')+'<span>Скидка автоматически учитывается в новых документах. Уже сохранённые суммы документов не пересчитываются.</span></p><button type="submit" class="btn btn-subtle btn-small" style="margin:12px 0 23px">'+icon('check')+' Сохранить условия</button></form><dl class="detail-fields"><dt>Telegram</dt><dd>'+esc(c.handle||'Не указан')+'</dd><dt>Телефон</dt><dd>'+esc(c.phone||'Не указан')+'</dd><dt>Компания</dt><dd>'+esc(c.company||'Не заполнена')+'</dd><dt>ИНН</dt><dd>'+esc(c.inn||'Не заполнен')+'</dd><dt>Всего заказов</dt><dd>'+(ds.length+(c.priorOrders||0))+'</dd><dt>Оплачено</dt><dd>'+money(ds.reduce(function(sum,d){return sum+d.paid;},c.priorPaid||0))+'</dd></dl><div class="panel-head" style="margin:25px 0 13px"><h3 class="panel-title">История заказов</h3></div>'+ds.map(function(d){return '<div class="client-history"><span><button type="button" data-client-history="'+d.id+'">'+d.code+' · '+esc(d.project)+'</button><small>'+stageName(d.stage)+'</small></span><strong>'+money(d.amount)+'</strong></div>';}).join('')+(c.priorOrders?'<div class="client-history"><span class="muted">Предыдущие заказы · '+c.priorOrders+'<small>История до перехода · демонстрационные данные</small></span><strong>'+money(c.priorPaid||0)+'</strong></div>':'')+'</div><div class="dialog-footer"><button type="button" class="btn btn-glass" data-cl   function openImport(clientId){state.importClientId=clientId?Number(clientId):null;state.importFound=false;const c=client(state.importClientId)||client(6);openModal(modalHead('Найти клиента в RetailCRM','Переносим нужные данные, сохраняя чистоту новой базы.')+'<div class="dialog-body"><div class="pill-note" style="margin-bottom:18px">Демонстрация поиска. Используйте телефон из примера — к RetailCRM мы пока не подключены.</div><form id="import-search-form" class="import-search"><label class="sr-only" for="import-phone">Телефон клиента</label><input id="import-phone" name="phone" type="tel" value="'+esc(c.phone||'+7 (000) 000-01-08')+'" placeholder="Телефон клиента" required><button type="submit" class="btn btn-primary">'+icon('search')+' Найти</button></form><div id="import-results"><p class="hint">'+icon('info')+'<span>Проверьте совпадение перед переносом. Можно выбрать только контакты и реквизиты, оставив старые заказы в архиве.</span></p></div></div><div class="dialog-footer"><button type="button" class="btn btn-glass" data-close="modal">Закрыть</button><button type="button" class="btn btn-primary" id="apply-import" data-action="apply-import" disabled>Перенести выбранное '+icon('arrow')+'</button></div>');}

    if(el.dataset.inboxTab){state.inboxTab=el.dataset.inboxTab;state.inboxOpen=false;render();return;}
    if(el.dataset.period){state.period=el.dataset.period;render();return;}
    if(el.dataset.mobileTab){state.mobileTab=el.dataset.mobileTab;document.getElementById('deal-dialog').dataset.mobileTab=state.mobileTab;document.querySelectorAll('[data-mobile-tab].detail-dialog button[data-mobile-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.mobileTab===state.mobileTab);});scrollMessages();return;}
    if(el.dataset.importClient)return openImport(el.dataset.importClient);

    if(el.dataset.linkDuplicate||el.dataset.dismissDuplicate){const c=client(el.dataset.linkDuplicate||el.dataset.dismissDuplicate);c.duplicate=false;if(el.dataset.linkDuplicate)c.linkedChannels=['telegram','instagram'];closeModal();afterMutation();toast(el.dataset.linkDuplicate?'Связь между обращениями подтверждена · демо':'Контакты оставлены раздельно');return;}

    if(el.dataset.confirmService){setClientSegment(client(el.dataset.confirmService),'employee');closeModal();document.getElementById('deal-dialog').close();afterMutation();toast('Служебный контакт исключён из клиентских показателей');return;}
    if(el.dataset.docType)return chooseDocument(el.dataset.docType,el.dataset.docDeal);
    if(el.dataset.document){const doc=data.documents.find(function(d){return d.id===Number(el.dataset.document);});if(doc)showDocument(doc.type,doc.dealId,doc.id);return;}
    if(el.dataset.saveDocument)return saveDocument(el.dataset.saveDocument,el.dataset.documentDeal,el.dataset.existing);
    if(el.dataset.downloadDocument)return downloadDocument(el.dataset.downloadDocument,el.dataset.documentDeal);

    if(el.dataset.markPayment)return openPayment(el.dataset.markPayment);
    if(el.dataset.editAmount)return openAmount(el.dataset.editAmount);
    if(el.dataset.addTask){openModal(modalHead('Новая задача',getDeal(el.dataset.addTask).code)+'<form id="task-form" data-id="'+el.dataset.addTask+'"><div class="dialog-body"><label class="field">Что нужно сделать<input name="text" maxlength="160" placeholder="Например, уточнить время съёмки" required></label></div><div class="dialog-footer"><button class="btn btn-glass" type="button" data-close="modal">Отмена</button><button class="btn btn-primary" type="submit">Добавить задачу</button></div></form>');return;}
    if(el.dataset.quick){const root=el.closest('.chat-compose');root.querySelector('input[name="message"]').value=el.dataset.quick;root.querySelector('input[name="message"]').focus();return;}
    if(el.dataset.role){data.role=el.dataset.role;save();render();toast('Показан интерфейс '+(data.role==='owner'?'руководителя':'менеджера'));return;}
    if(el.dataset.call){openModal(modalHead('Звонок клиенту',esc(client(el.dataset.call).name))+'<div class="dialog-body"><p class="pill-note">Телефония появится после уточнения провайдера и проверки подключения. В прототипе звонки не выполняются.</p></div><div class="dialog-footer"><button class="btn btn-primary" type="button" data-close="modal">Понятно</button></div>');}
  });
  document.addEventListener('input',function(event){const el=event.target;if(el.id==='board-search'){state.query=el.value;updateBoard();}if(el.id==='client-search'){state.clientQuery=el.value;document.getElementById('client-rows').innerHTML=clientRows();}});
  document.addEventListener('change',function(event){const el=event.target;
    if(el.dataset.attachContext){prepareAttachments(el);return;}

    if(el.id==='board-channel'){state.channel=el.value;updateBoard();}
    if(el.id==='board-account'){state.account=el.value;updateBoard();}

    if(el.dataset.dealPipeline){const d=getDeal(el.dataset.dealPipeline);d.pipeline=el.value;recordHistory(d,'Изменена воронка продаж');afterMutation();toast('Воронка сделки обновлена');}
    if(el.dataset.clientSegment){const c=client(el.dataset.clientSegment);setClientSegment(c,el.value);if(c.service)document.getElementById('deal-dialog').close();afterMutation();toast(c.service?'Сотрудник исключён из клиентских показателей':'Сегмент клиента обновлён');}
    if(el.dataset.task!==undefined){const d=getDeal(el.dataset.taskDeal);d.tasks[Number(el.dataset.task)].done=el.checked;recordHistory(d,el.checked?'Задача выполнена':'Задача возвращена в работу');afterMutation();}
  });
  document.addEventListener('submit',function(event){event.preventDefault();const form=event.target;const fd=new FormData(form);
    if(form.id==='client-profile-form'){const c=client(form.dataset.id);const discount=Number(fd.get('discount'));if(!Number.isFinite(discount)||discount<0||discount>100){toast('Скидка должна быть от 0 до 100%');return;}setClientSegment(c,String(fd.get('segment')));c.discount=discount;closeModal();if(c.service)document.getElementById('deal-dialog').close();afterMutation();toast('Сегмент и постоянная скидка сохранены');return;}
    if(form.id==='new-deal-form'){const name=String(fd.get('name')).trim();const project=String(fd.get('project')).trim();if(!name||!project){toast('Введите имя клиента и название проекта');return;}if(form.dataset.stage==='invoice'&&!Number(fd.get('amount'))){toast('Для счёта нужна сумма сделки');return;}const cid=Math.max(0,...data.clients.map(function(c){return c.id;}))+1;const id=Math.max(0,...data.deals.map(function(d){return d.id;}))+1;data.clients.push({id:cid,name:name,brand:project,handle:String(fd.get('handle')).trim(),phone:'',segment:String(fd.get('segment'))});const stage=['paid','lost'].includes(form.dataset.stage)?'new':form.dataset.stage;const d=deal(id,cid,stage,Number(fd.get('amount')||0),0,String(fd.get('pipeline')),project,String(fd.get('account')),'telegram',TODAY);d.messages=[{side:'event',text:'Сделка создана менеджером вручную',time:''}];data.deals.push(d);recordHistory(d,'Создана вручную менеджером');state.pipeline=d.pipeline;state.segment='all';state.channel='all';state.account='all';state.waiting=false;state.query='';closeModal();afterMutation();toast('Создан заказ '+d.code);return;}
    if(form.id==='lost-form'){const d=getDeal(form.dataset.id);d.stage='lost';d.reason=String(fd.get('reason'));d.wait=0;recordHistory(d,'Сделка закрыта с отказом: '+d.reason);closeModal();afterMutation();toast('Причина отказа сохранена');return;}
    if(form.id==='import-search-form'){findImport(String(fd.get('phone')));return;}
    if(form.id==='document-choose-form'){showDocument(form.dataset.type,Number(fd.get('deal')));return;}
    if(form.id==='payment-form'){const d=getDeal(form.dataset.id);const amount=Number(fd.get('amount'));if(!(amount>0&&amount<=d.amount-d.paid)){toast('Проверьте сумму поступления');return;}d.paid+=amount;d.paidOn=TODAY;d.stage='paid';recordHistory(d,'Добавлена демонстрационная оплата '+money(amount));closeModal();afterMutation();toast('Оплата отмечена в прототипе');return;}
    if(form.id==='amount-form'){const d=getDeal(form.dataset.id);d.amount=Number(fd.get('amount'));recordHistory(d,'Сумма сделки изменена на '+money(d.amount));closeModal();afterMutation();toast('Сумма сделки обновлена');return;}
    if(form.id==='task-form'){const text=String(fd.get('text')).trim();if(!text){toast('Введите текст задачи');return;}const d=getDeal(form.dataset.id);d.tasks.push({text:text,done:false});recordHistory(d,'Добавлена задача');closeModal();afterMutation();toast('Задача добавлена');return;}
    if(form.dataset.chatForm){const d=getDeal(form.dataset.chatForm);const text=String(fd.get('message')).trim();const attachments=state.attachments[form.dataset.context]||[];if(!text&&!attachments.length)return;d.messages.push({side:'out',text:text,attachments:attachments.slice(),time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'})});state.attachments[form.dataset.context]=[];d.wait=0;recordHistory(d,'Добавлено сообщение в демонстрационную переписку');save();render();if(document.getElementById('deal-dialog').open)renderDeal();scrollMessages();toast('Сообщение добавлено в макет. Клиенту не отправлено.');}
  });
  let dragging=null;
  document.addEventListener('dragstart',function(event){const card=event.target.closest('[data-deal][draggable]');if(!card)return;dragging=Number(card.dataset.deal);event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',String(dragging));});
  document.addEventListener('dragover',function(event){const col=event.target.closest('[data-drop-stage]');if(col&&dragging){event.preventDefault();col.classList.add('drag-over');event.dataTransfer.dropEffect='move';}});
  document.addEventListener('dragleave',function(event){const col=event.target.closest('[data-drop-stage]');if(col&&!col.contains(event.relatedTarget))col.classList.remove('drag-over');});
  document.addEventListener('drop',function(event){const col=event.target.closest('[data-drop-stage]');if(col&&dragging){event.preventDefault();const id=dragging;dragging=null;document.querySelectorAll('.drag-over').forEach(function(c){c.classList.remove('drag-over');});requestStage(id,col.dataset.dropStage);}});
  document.addEventListener('dragend',function(){dragging=null;document.querySelectorAll('.drag-over').forEach(function(c){c.classList.remove('drag-over');});});
  document.querySelectorAll('dialog').forEach(function(dialog){dialog.addEventListener('click',function(event){if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();});});

  function migrateData(value){
    value.clients.forEach(function(c){if(c.service)c.segment='employee';if(!Number.isFinite(c.discount))c.discount=0;});
    value.deals.forEach(function(d){if(d.stage==='shoot'||d.stage==='done')d.stage='paid';if(d.reason==='Не вышел на связь')d.reason='Игнор / не выходит на связь';});
    value.documents.forEach(function(doc){const d=value.deals.find(function(x){return x.id===doc.dealId;});if(!doc.pricing&&d)doc.pricing={base:d.baseAmount||d.amount,percent:d.discountPercent||0,total:d.amount,discount:Math.max(0,(d.baseAmount||d.amount)-d.amount)};});
    if(value.version===1){const d=value.deals.find(function(x){return x.id===6;});if(d){value.documents.push({id:Math.max(0,...value.documents.map(function(x){return x.id;}))+1,type:'act',dealId:d.id,number:'АКТ-1046',status:'Черновик',date:TODAY,pricing:{base:d.amount,percent:0,total:d.amount,discount:0}});}const ignored=value.deals.find(function(x){return x.id===13;});if(ignored)ignored.reason='Игнор / не выходит на связь';}
    if(!value.clients.some(function(c){return c.demoSpam;})){const cid=Math.max(0,...value.clients.map(function(c){return c.id;}))+1;value.clients.push({id:cid,name:'Рекламная рассылка',brand:'Нежелательное предложение',handle:'@promo_demo',segment:'new',phone:'',discount:0,demoSpam:true});const id=Math.max(0,...value.deals.map(function(d){return d.id;}))+1;const d=deal(id,cid,'new',0,0,'initial','Продвижение аккаунта','production','telegram',TODAY);d.spam=true;d.messages=[{side:'in',text:'Предлагаем массовое продвижение аккаунта. Рекламная рассылка — пример спама.',time:'09:12'}];value.deals.push(d);}
    value.version=2;return value;
  }
  function isCustomerContact(c){const ds=data.deals.filter(function(d){return d.clientId===c.id;});return !c.service&&c.segment!=='employee'&&(!ds.length||ds.some(function(d){return !d.spam;}));}
  function setClientSegment(c,segment){if(!CONTACT_SEGMENTS[segment])return;c.segment=segment;c.service=segment==='employee';}
  function currentQuote(d){const base=Number(d.baseAmount==null?d.amount:d.baseAmount),percent=Number(client(d.clientId).discount||0);const total=Math.round(base*(1-percent/100));return {base:base,percent:percent,total:total,discount:base-total};}
  function confirmSpam(id){const d=getDeal(id);openModal(modalHead('Перенести диалог в спам?',esc(client(d.clientId).name))+'<div class="dialog-body"><p class="page-description">Диалог сохранится в отдельной папке. Он перестанет учитываться в лидах, конверсии и напоминаниях об ответе. Его можно вернуть кнопкой «Не спам».</p></div><div class="dialog-footer"><button type="button" class="btn btn-glass" data-close="modal">Отмена</button><button type="button" class="btn btn-primary" data-confirm-spam="'+d.id+'">'+icon('ban')+' В спам</button></div>');}
  function attachmentsHTML(context){return (state.attachments[context]||[]).map(function(a,index){return '<div class="attachment-preview"><img src="'+esc(a.dataUrl)+'" alt="'+esc(a.name)+'"><span>'+esc(a.name)+'</span><button type="button" data-remove-attachment="'+index+'" data-attach-context="'+context+'" aria-label="Убрать фото '+esc(a.name)+'">'+icon('close')+'</button></div>';}).join('');}
  function updateAttachments(context){document.querySelectorAll('#attachments-'+context).forEach(function(el){el.innerHTML=attachmentsHTML(context);});}
  async function prepareAttachments(input){
    const context=input.dataset.attachContext,files=Array.from(input.files||[]);state.attachments[context]=state.attachments[context]||[];input.value='';
    for(const file of files){if(state.attachments[context].length>=3){toast('К сообщению можно добавить до трёх фото');break;}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Для предпросмотра выберите JPEG, PNG или WebP');continue;}if(file.size>20*1024*1024){toast('Выберите фото меньше 20 МБ');continue;}
      try{const bitmap=await createImageBitmap(file);const scale=Math.min(1,1000/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();state.attachments[context].push({name:file.name,dataUrl:canvas.toDataURL('image/jpeg',.65)});updateAttachments(context);}catch(e){toast('Не удалось открыть фото. Попробуйте другой файл.');}
    }
  }

  const DESIGNS=[
    {id:'classic',index:'00',name:'Бордовый',short:'Бордовый',description:'Первый вариант. Бордо и мягкий розовый.',colors:['#6d233e','#f2e9ed','#b86a86'],meta:'#52182d'},
    {id:'sage',index:'01',name:'Шалфей и вино',short:'Шалфей и вино',description:'Шалфейный серый, тёплый бежевый и глубокий бордовый.',colors:['#A5A79B','#E8D2B5','#590907'],meta:'#a5a79b'},
    {id:'orchid',index:'02',name:'Орхидея и апельсин',short:'Орхидея',description:'Пастельная орхидея, баклажан и яркий оранжевый акцент.',colors:['#E7B0DE','#400849','#FF5A0A'],meta:'#e7b0de'},
    {id:'nocturne',index:'03',name:'Ночное стекло',short:'Ночное стекло',description:'Тёмный баклажан, розовые отражения и тёплый свет.',colors:['#1D1023','#E7B0DE','#FF5A0A'],meta:'#1d1023'}
  ];
  let currentDesign='classic';
  function designInfo(){return DESIGNS.find(function(d){return d.id===currentDesign;})||DESIGNS[0];}
  function designURL(){const url=new URL(location.href);url.searchParams.set('theme',currentDesign);return url.href;}
  function applyDesign(id,persist){
    if(!DESIGNS.some(function(d){return d.id===id;}))id='classic';currentDesign=id;
    if(id==='classic')delete document.documentElement.dataset.design;else document.documentElement.dataset.design=id;
    document.querySelector('meta[name="theme-color"]').setAttribute('content',designInfo().meta);
    document.getElementById('design-current-name').textContent=designInfo().short;
    document.getElementById('design-trigger-icon').innerHTML=icon('palette');
    if(persist){try{localStorage.setItem('also-crm-design-v1',id);}catch(e){}try{window.history.replaceState(null,'',designURL());}catch(e){}}
  }
  function openDesignChooser(){openModal(modalHead('Настроение пространства','Первый дизайн и ещё три варианта. Все экраны и данные — те же.')+'<div class="dialog-body"><div class="design-options">'+DESIGNS.map(function(d){return '<button type="button" class="design-option '+(d.id===currentDesign?'selected':'')+'" data-design-choice="'+d.id+'" aria-pressed="'+(d.id===currentDesign)+'"><span class="design-index">'+d.index+'</span><span class="design-palette">'+d.colors.map(function(c){return '<i style="background:'+c+'"></i>';}).join('')+'</span><strong>'+d.name+'</strong><p>'+d.description+'</p></button>';}).join('')+'</div><div class="design-share"><button type="button" class="btn btn-glass" data-action="share-design">'+icon('link')+' Ссылка на этот вариант</button><a class="text-btn" href="designs.html">Сравнить три новых '+icon('arrowup')+'</a></div></div><div class="dialog-footer"><button type="button" class="btn btn-primary" data-close="modal">Продолжить просмотр</button></div>','650px');}
  async function shareDesign(){const url=designURL();try{await navigator.clipboard.writeText(url);toast('Ссылка на вариант «'+designInfo().name+'» скопирована');}catch(e){openModal(modalHead('Ссылка на вариант',esc(designInfo().name))+'<div class="dialog-body"><label class="field">Скопируйте ссылку<input readonly value="'+esc(url)+'" aria-label="Ссылка на выбранный дизайн"></label></div><div class="dialog-footer"><button type="button" class="btn btn-primary" data-close="modal">Готово</button></div>');}}
  ICONS.palette='<circle cx="12" cy="12" r="9"/><circle cx="8" cy="9" r="1"/><circle cx="12" cy="6.5" r="1"/><circle cx="16" cy="9" r="1"/><path d="M20 13h-4a2 2 0 0 0-2 2v1a2 2 0 0 1-2 2"/>';
  let initialDesign='classic';try{const requested=new URLSearchParams(location.search).get('theme');initialDesign=requested||localStorage.getItem('also-crm-design-v1')||'classic';}catch(e){}
  applyDesign(initialDesign,false);

  document.getElementById('workspace-icon').innerHTML=icon('building');document.getElementById('migration-arrow').innerHTML=icon('arrow');document.getElementById('settings-button').innerHTML=icon('settings');document.getElementById('profile-chevron').innerHTML=icon('down');document.getElementById('notifications-button').innerHTML=icon('bell');document.getElementById('review-button').innerHTML=icon('help');
  render();
